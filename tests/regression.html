<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Testes de regressão</title>
<style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    li.pass { color: #1a7a4a; }
    li.fail { color: #9b2020; font-weight: 600; }
    iframe { position: absolute; left: -9999px; width: 1200px; height: 900px; }
</style>
</head>
<body>
<h1>Testes de regressão</h1>
<p id="summary">Executando…</p>
<ul id="list"></ul>
<script>
const CRITERIA = ['C1', 'C2', 'C3'];
const results = [];
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

// ---- Condução da aplicação real, carregada em um iframe ----
let frame = null;
let pageWidth = 1200;

async function load(width = 1200) {
    pageWidth = width;
    // Nesta ordem: remover o iframe dispara o salvamento da análise que estava aberta
    if (frame) frame.remove();
    frame = null;
    localStorage.clear();
    return openPage();
}

// Abre a aplicação preservando o localStorage, como ao recarregar a página
async function openPage() {
    if (frame) frame.remove();
    frame = document.createElement('iframe');
    frame.style.width = `${pageWidth}px`;
    frame.src = '../index.html?' + Math.random();
    document.body.appendChild(frame);
    await new Promise(resolve => { frame.onload = resolve; });
    const w = frame.contentWindow;
    w.alert = () => {};
    w.confirm = () => true;
    w.uiErrors = [];
    w.addEventListener('error', event => w.uiErrors.push(event.message));
    return w;
}

const el = (w, id) => w.document.getElementById(id);
const read = (w, expr) => w.eval(expr);
const card = (w, text) => [...w.document.querySelectorAll('#comparisonInterface .alternative-card')]
    .find(c => c.textContent.includes(text));
const button = (w, text) => [...w.document.querySelectorAll('#comparisonInterface button')]
    .find(b => b.textContent.includes(text));
const action = (w, name) => w.document.querySelector(`[data-action="${name}"]`);
const criterionId = (w, name) => read(w, `state.criteria.find(c => c.name === ${JSON.stringify(name)}).id`);
const alternativeId = (w, name) => read(w, `state.alternatives.find(a => a.name === ${JSON.stringify(name)}).id`);
const weightsByName = w => read(w, 'Object.fromEntries(state.criteria.map(c => [c.name, state.weights[c.id]]))');

function setField(w, id, value, eventName = 'input') {
    const field = el(w, id);
    field.value = value;
    field.dispatchEvent(new w.Event(eventName, { bubbles: true }));
}

const goToCriterion = (w, index) => w.document.querySelectorAll('.criterion-nav button')[index].click();

async function setup(w, criteria, alternatives) {
    setField(w, 'problemTitle', 'Teste');
    await w.nextStep();
    for (const c of criteria) { el(w, 'criterionInput').value = c; w.addCriterion(); }
    await w.nextStep();
    for (const a of alternatives) { el(w, 'alternativeInput').value = a; w.addAlternative(); }
    await w.nextStep();
}

function score(w, best, bestScore, worst, worstScore, sameLevel = []) {
    card(w, best).click();
    el(w, 'bestScore').value = bestScore;
    button(w, 'Confirmar').click();
    card(w, worst).click();
    el(w, 'worstScore').value = worstScore;
    button(w, 'Confirmar').click();
    for (const reference of sameLevel) card(w, `Mesmo nível de "${reference}"`).click();
}

// A = C = 10 e B = 2 em todos os critérios
async function goToWeights(w, criteria = CRITERIA) {
    await setup(w, criteria, ['A', 'B', 'C']);
    criteria.forEach((_, i) => { goToCriterion(w, i); score(w, 'A', 10, 'B', 2, ['A']); });
    await w.nextStep();
}

const selectMethod = (w, method) => setField(w, 'weightingMethod', method, 'change');

// Posições na ordem atual dos critérios
function rankSum(w, ranks) {
    selectMethod(w, 'ranksum');
    read(w, 'criterionIds()').forEach((id, i) => setField(w, `ranksum_${id}`, ranks[i], 'change'));
}

function swing(w) {
    selectMethod(w, 'swingweighting');
    const [first, second, third] = read(w, 'criterionIds()');
    setField(w, 'mostImportant', first, 'change');
    setField(w, `swingweight_${second}`, 50, 'change');
    setField(w, `swingweight_${third}`, 25, 'change');
}

// ---- Asserções ----
function equal(actual, expected, label) {
    const a = JSON.stringify(actual), e = JSON.stringify(expected);
    if (a !== e) throw new Error(`${label}: esperado ${e}, obtido ${a}`);
}

function close(actual, expected, label) {
    if (Math.abs(actual - expected) > 1e-6) throw new Error(`${label}: esperado ${expected}, obtido ${actual}`);
}

// Larguras lidas do CSS: o navegador as arredonda
function closePercent(actual, expected, label) {
    if (Math.abs(actual - expected) > 0.01) throw new Error(`${label}: esperado ${expected}, obtido ${actual}`);
}

function closeWeights(actual, expected) {
    equal(Object.keys(actual).sort(), Object.keys(expected).sort(), 'critérios dos pesos');
    Object.keys(expected).forEach(c => close(actual[c], expected[c], `peso de ${c}`));
}

const RANK_123 = { C1: 3 / 6, C2: 2 / 6, C3: 1 / 6 };
const SWING_100_50_25 = { C1: 100 / 175, C2: 50 / 175, C3: 25 / 175 };

const tests = [];
function test(name, fn) { tests.push({ name, fn }); }

// ---- Cálculo (sem interface) ----
test('Núcleo: score 0 é um valor válido', async () => {
    const w = await load();
    const entry = { best: 'a', bestScore: 0, worst: 'b', worstScore: 0, scores: { c: 0 } };
    equal(['a', 'b', 'c', 'd'].map(id => w.getScore(entry, id)), [0, 0, 0, null], 'scores');
    equal(w.isCriterionComplete(entry, ['a', 'b', 'c']), true, 'completo');
    equal(w.isCriterionComplete(entry, ['a', 'd']), false, 'incompleto');
    equal(w.getScore(undefined, 'a'), null, 'sem dados');
});

test('Núcleo: soma ponderada e ordenação', async () => {
    const w = await load();
    const data = {
        c1: { best: 'a', bestScore: 10, worst: 'b', worstScore: 0, scores: {} },
        c2: { best: 'b', bestScore: 8, worst: 'a', worstScore: 2, scores: {} },
    };
    const finals = w.computeFinalScores(['c1', 'c2'], ['a', 'b'], data, { c1: 0.75, c2: 0.25 });
    close(finals.a, 8, 'a');
    close(finals.b, 2, 'b');
    equal(w.sortByFinalScore(['b', 'a'], finals), ['a', 'b'], 'ordem');
});

test('Núcleo: empates, inclusive por arredondamento', async () => {
    const w = await load();
    const finals = { a: 0.1 + 0.2, b: 0.3, c: 0.1 };
    equal(w.computeRankPositions(finals, ['a', 'b', 'c']), [1, 1, 3], 'posições');
    equal(w.topAlternatives(finals, ['a', 'b', 'c']), ['a', 'b'], 'vencedoras');
});

test('Núcleo: Rank-Sum', async () => {
    const w = await load();
    const ok = w.computeRankSumWeights({ x: 2, y: 1, z: 3 });
    closeWeights(ok.weights, { x: 2 / 6, y: 3 / 6, z: 1 / 6 });
    equal(w.computeRankSumWeights({ x: 1, y: NaN }).ok, false, 'incompleto');
    equal(w.computeRankSumWeights({ x: 1, y: 1 }).duplicate, true, 'duplicado');
});

test('Núcleo: normalização e redistribuição de pesos', async () => {
    const w = await load();
    closeWeights(w.normalizeWeights({ x: 100, y: 50, z: 50 }), { x: 0.5, y: 0.25, z: 0.25 });
    closeWeights(w.normalizeWeights({ x: 0, y: 0 }), { x: 0, y: 0 });
    closeWeights(w.redistributeWeights({ x: 0.5, y: 0.3, z: 0.2 }, 'x', 0.75), { x: 0.75, y: 0.15, z: 0.1 });
    closeWeights(w.redistributeWeights({ x: 1, y: 0, z: 0 }, 'x', 0.5), { x: 0.5, y: 0.25, z: 0.25 });
});

test('Limpeza das sugestões da IA preserva os nomes', async () => {
    const w = await load();
    equal(
        w.parseCriteriaSuggestions('1. Custo, 2) Prazo\n- Qualidade, **Risco**, 5G, * Local, `Marca`, 3D,  , '),
        ['Custo', 'Prazo', 'Qualidade', 'Risco', '5G', 'Local', 'Marca', '3D'],
        'critérios'
    );
});

test('escapeHtml cobre texto e atributos', async () => {
    const w = await load();
    equal(w.escapeHtml(`<a b="c" d='e'>&`), '&lt;a b=&quot;c&quot; d=&#39;e&#39;&gt;&amp;', 'escape');
});

// ---- Fluxos ----
test('Fluxo completo com Rank-Sum calcula a soma ponderada', async () => {
    const w = await load();
    await goToWeights(w);
    rankSum(w, [1, 2, 3]);
    await w.nextStep();
    equal(read(w, 'state.currentStep'), 6, 'passo');
    closeWeights(weightsByName(w), RANK_123);
    const finals = w.buildExportData().scoresFinais;
    close(finals.A, 10, 'A'); close(finals.B, 2, 'B'); close(finals.C, 10, 'C');
});

test('Fluxo completo com Swing normaliza os pesos', async () => {
    const w = await load();
    await goToWeights(w);
    swing(w);
    await w.nextStep();
    equal(read(w, 'state.currentStep'), 6, 'passo');
    closeWeights(weightsByName(w), SWING_100_50_25);
});

test('Posicionar entre duas alternativas usa a faixa delas', async () => {
    const w = await load();
    await setup(w, ['C1', 'C2'], ['A', 'B', 'C']);
    score(w, 'A', 10, 'B', 2);
    card(w, 'Entre "A" e "B"').click();
    el(w, 'positionScore').value = 11;
    button(w, 'Definir Score').click();
    equal(!!el(w, 'positionScore'), true, 'rejeita fora da faixa');
    el(w, 'positionScore').value = 5;
    button(w, 'Definir Score').click();
    const data = read(w, `state.comparisonData['${criterionId(w, 'C1')}'].scores`);
    equal(data[alternativeId(w, 'C')], 5, 'score');
});

test('Nota 0 no mesmo nível da pior alternativa conclui o critério', async () => {
    const w = await load();
    await setup(w, ['C1', 'C2'], ['A', 'B', 'C']);
    score(w, 'A', 10, 'B', 0, ['B']);
    equal(!!card(w, 'Mesmo nível de'), false, 'pergunta repetida');
    goToCriterion(w, 1);
    score(w, 'A', 10, 'B', 0, ['B']);
    await w.nextStep();
    equal(read(w, 'state.currentStep'), 5, 'passo');
});

test('Trocar de método sem preencher o novo não usa os pesos do anterior', async () => {
    const w = await load();
    await goToWeights(w);
    swing(w);
    selectMethod(w, 'ranksum');
    await w.nextStep();
    equal(read(w, 'state.currentStep'), 5, 'passo');
});

test('Posições duplicadas no Rank-Sum impedem o avanço', async () => {
    const w = await load();
    await goToWeights(w);
    rankSum(w, [1, 2, 3]);
    rankSum(w, [3, 3, 3]);
    await w.nextStep();
    equal(read(w, 'state.currentStep'), 5, 'passo');
});

test('Remover critério recalcula os pesos para somar 100%', async () => {
    const w = await load();
    await goToWeights(w);
    rankSum(w, [1, 2, 3]);
    w.goToStep(2);
    w.removeCriterion(criterionId(w, 'C1'));
    await w.nextStep();
    await w.nextStep();
    await w.nextStep();
    equal(read(w, 'state.currentStep'), 5, 'passo');
    await w.nextStep();
    equal(read(w, 'state.currentStep'), 5, 'não avança com posição inválida');
    rankSum(w, [1, 2]);
    await w.nextStep();
    equal(read(w, 'state.currentStep'), 6, 'passo final');
    closeWeights(weightsByName(w), { C2: 2 / 3, C3: 1 / 3 });
});

test('Ajustes dos sliders não substituem os pesos do método', async () => {
    const w = await load();
    await goToWeights(w);
    rankSum(w, [1, 2, 3]);
    await w.nextStep();
    action(w, 'equalizeWeights').click();
    equal(el(w, 'resultsMethod').textContent, 'Rank-Sum (pesos ajustados manualmente)', 'método com ajuste');
    w.prevStep();
    await w.nextStep();
    closeWeights(weightsByName(w), RANK_123);
    equal(el(w, 'resultsMethod').textContent, 'Rank-Sum', 'método após recalcular');
    action(w, 'equalizeWeights').click();
    action(w, 'resetWeights').click();
    closeWeights(weightsByName(w), RANK_123);
    equal(el(w, 'resultsMethod').textContent, 'Rank-Sum', 'método após restaurar');
});

test('Peso digitado é mantido e os demais dividem o restante', async () => {
    const w = await load();
    await goToWeights(w);
    rankSum(w, [1, 2, 3]);
    await w.nextStep();
    action(w, 'equalizeWeights').click();
    const id = criterionId(w, 'C1');
    setField(w, `weight-input-${id}`, '50', 'change');
    equal(el(w, `weight-input-${id}`).value, '50.0', 'valor exibido');
    closeWeights(weightsByName(w), { C1: 0.5, C2: 0.25, C3: 0.25 });
    setField(w, `weight-${id}`, '100');
    closeWeights(weightsByName(w), { C1: 1, C2: 0, C3: 0 });
    setField(w, `weight-${id}`, '40');
    closeWeights(weightsByName(w), { C1: 0.4, C2: 0.3, C3: 0.3 });
});

test('Empates dividem a posição e aparecem na recomendação', async () => {
    const w = await load();
    await goToWeights(w);
    rankSum(w, [1, 2, 3]);
    await w.nextStep();
    const rows = () => [...w.document.querySelectorAll('#dynamicRanking li')].map(li => ({
        position: li.querySelector('.ranking-position').textContent,
        tied: !!li.querySelector('.tie-badge'),
    }));
    const expected = [
        { position: '1', tied: true }, { position: '1', tied: true }, { position: '3', tied: false },
    ];
    equal(rows(), expected, 'ranking inicial');
    equal(el(w, 'topAlternative').textContent, 'A e C (empate)', 'recomendação inicial');
    action(w, 'equalizeWeights').click();
    equal(rows(), expected, 'ranking após mexer nos pesos');
    equal(el(w, 'topAlternative').textContent, 'A e C (empate)', 'recomendação após mexer nos pesos');
});

test('Sem empate, a recomendação traz só a vencedora', async () => {
    const w = await load();
    await setup(w, ['C1', 'C2'], ['A', 'B']);
    score(w, 'A', 10, 'B', 2);
    goToCriterion(w, 1);
    score(w, 'A', 8, 'B', 2);
    await w.nextStep();
    rankSum(w, [1, 2]);
    await w.nextStep();
    equal(el(w, 'topAlternative').textContent, 'A', 'recomendação');
    equal(w.document.querySelectorAll('.tie-badge').length, 0, 'marcadores de empate');
});

test('Nova Análise pede confirmação e restaura progresso e banner', async () => {
    const w = await load();
    await goToWeights(w);
    rankSum(w, [1, 2, 3]);
    await w.nextStep();

    w.confirm = () => false;
    w.restart();
    equal(read(w, 'state.currentStep'), 6, 'cancelar mantém a análise');

    w.confirm = () => true;
    w.restart();
    equal(read(w, 'state.currentStep'), 1, 'passo');
    equal(el(w, 'prog-dot-0').classList.contains('active'), true, 'primeiro ponto ativo');
    equal(el(w, 'prog-dot-5').classList.contains('active'), false, 'último ponto inativo');
    equal(el(w, 'contextBanner').classList.contains('visible'), false, 'banner');
    equal(read(w, 'state.criteria'), [], 'critérios');
    equal(read(w, 'state.weightingInputs.ranks'), {}, 'entradas de pesagem');
});

test('Critério pode ser reiniciado em qualquer subetapa', async () => {
    const w = await load();
    await setup(w, ['C1', 'C2'], ['A', 'B', 'C']);
    const entry = () => read(w, `state.comparisonData['${criterionId(w, 'C1')}']`);
    equal(!!button(w, 'Reiniciar'), false, 'nada a reiniciar antes da primeira escolha');
    card(w, 'A').click();
    button(w, 'Reiniciar').click();
    equal(entry(), {}, 'após escolher a melhor');
    score(w, 'A', 10, 'B', 2);
    button(w, 'Reiniciar').click();
    equal(entry(), {}, 'durante o posicionamento');
});

test('Voltar ao passo de pesos preserva o Rank-Sum', async () => {
    const w = await load();
    await goToWeights(w);
    rankSum(w, [2, 1, 3]);
    await w.nextStep();
    w.prevStep();
    equal(read(w, 'criterionIds()').map(id => el(w, `ranksum_${id}`).value), ['2', '1', '3'], 'posições');
    await w.nextStep();
    equal(read(w, 'state.currentStep'), 6, 'passo');
});

test('Voltar ao passo de pesos preserva o Swing', async () => {
    const w = await load();
    await goToWeights(w);
    swing(w);
    await w.nextStep();
    w.prevStep();
    const [first, second] = read(w, 'criterionIds()');
    equal(el(w, 'mostImportant').value, first, 'mais importante');
    equal(el(w, `swingweight_${second}`).value, '50', 'impacto');
    await w.nextStep();
    closeWeights(weightsByName(w), SWING_100_50_25);
});

test('Swing sugere o pior cenário a partir das âncoras e respeita a edição', async () => {
    const w = await load();
    await goToWeights(w);
    selectMethod(w, 'swingweighting');
    const id = criterionId(w, 'C1');
    equal(el(w, `worstValue_${id}`).value, '2', 'valor sugerido');
    equal(w.document.getElementById('worstAlternativeSummary').textContent.includes('Pior encontrado: 2'), true, 'texto');
    setField(w, `worstValue_${id}`, '1', 'change');
    selectMethod(w, 'ranksum');
    selectMethod(w, 'swingweighting');
    equal(el(w, `worstValue_${id}`).value, '1', 'valor editado');
});

test('Trocar o critério mais importante do Swing descarta os impactos', async () => {
    const w = await load();
    await goToWeights(w);
    swing(w);
    const [first, second] = read(w, 'criterionIds()');
    setField(w, 'mostImportant', second, 'change');
    equal(el(w, `swingweight_${first}`).value, '', 'impacto em branco');
    await w.nextStep();
    equal(read(w, 'state.currentStep'), 5, 'passo');
});

test('Renomear preserva scores e entradas de pesagem', async () => {
    const w = await load();
    await goToWeights(w);
    rankSum(w, [2, 1, 3]);
    const id = criterionId(w, 'C1');
    w.goToStep(2);
    w.document.querySelector(`[data-action="editItem"][data-id="${id}"]`).click();
    w.document.querySelector(`#criterion-item-${id} .edit-inline-input`).value = "Novo d'água";
    w.document.querySelector(`#criterion-item-${id} .btn-primary`).click();
    await w.nextStep();
    await w.nextStep();
    await w.nextStep();
    equal(el(w, `ranksum_${id}`).value, '2', 'posição mantida');
    await w.nextStep();
    equal(read(w, 'state.currentStep'), 6, 'scores mantidos');
    closeWeights(weightsByName(w), { "Novo d'água": 2 / 6, C2: 3 / 6, C3: 1 / 6 });
});

test('Remover alternativa pendente de nota limpa a posição selecionada', async () => {
    const w = await load();
    await setup(w, ['C1', 'C2'], ['A', 'B', 'C', 'D']);
    score(w, 'A', 10, 'B', 2);
    card(w, 'Entre "A" e "B"').click();
    action(w, 'toggleManagementPanel').click();
    const id = alternativeId(w, 'C');
    w.document.querySelector(`[data-action="removeAlternativeFromStep3"][data-id="${id}"]`).click();
    equal(!!el(w, 'positionScore'), false, 'campo de nota');
    equal(!!card(w, 'Onde') || !!w.document.querySelector('.position-options'), true, 'segue para a próxima');
});

// ---- Nomes com caracteres especiais ----
test('Apóstrofos e aspas funcionam em todo o fluxo', async () => {
    const w = await load();
    const c1 = "Custo d'água", c2 = 'Prazo "real"';
    await setup(w, [c1, c2], ["Caixa d'Água", 'Poço "novo"', 'C&A']);
    score(w, "Caixa d'Água", 10, 'Poço "novo"', 2, ["Caixa d'Água"]);
    goToCriterion(w, 1);
    score(w, 'Poço "novo"', 9, "Caixa d'Água", 0);
    card(w, `Entre "Poço "novo"" e "Caixa d'Água"`).click();
    el(w, 'positionScore').value = 3;
    button(w, 'Definir Score').click();
    await w.nextStep();
    equal(read(w, 'state.currentStep'), 5, 'scores concluídos');
    rankSum(w, [1, 2]);
    await w.nextStep();
    equal(read(w, 'state.currentStep'), 6, 'resultado');
    setField(w, `weight-${criterionId(w, c1)}`, '75');
    closeWeights(weightsByName(w), { [c1]: 0.75, [c2]: 0.25 });
    // C&A = 10 × 0,75 + 3 × 0,25 = 8,25; Caixa d'Água = 7,50; Poço "novo" = 3,75
    equal([...w.document.querySelectorAll('#dynamicRanking strong')].map(e => e.textContent), ['C&A', "Caixa d'Água", 'Poço "novo"'], 'ranking exibido');
    equal(w.uiErrors, [], 'erros na página');
});

test('HTML nos nomes é exibido como texto em todas as telas', async () => {
    const w = await load();
    const payload = name => `${name}"><img src=x onerror="window.__xss=1"><script>window.__xss=1<\/script>'`;
    const c1 = payload('C1'), c2 = payload('C2'), a1 = payload('A1'), a2 = payload('A2');
    setField(w, 'problemTitle', payload('T'));
    setField(w, 'problemDescription', payload('D'));
    await w.nextStep();
    for (const c of [c1, c2]) { el(w, 'criterionInput').value = c; w.addCriterion(); }
    await w.nextStep();
    for (const a of [a1, a2]) { el(w, 'alternativeInput').value = a; w.addAlternative(); }
    await w.nextStep();
    score(w, 'A1', 10, 'A2', 2);
    goToCriterion(w, 1);
    score(w, 'A1', 10, 'A2', 2);
    await w.nextStep();
    selectMethod(w, 'swingweighting');
    const [first, second] = read(w, 'criterionIds()');
    setField(w, 'mostImportant', first, 'change');
    setField(w, `swingweight_${second}`, 50, 'change');
    await w.nextStep();
    w.showError(payload('Toast'));
    equal(read(w, 'state.currentStep'), 6, 'resultado');
    await sleep(200);
    equal(w.__xss ?? null, null, 'código executado');
    equal(w.document.querySelectorAll('img[src="x"], .container script').length, 0, 'elementos injetados');
});

test('Sugestões da IA com HTML não executam', async () => {
    const w = await load();
    localStorage.setItem('gemini_api_key', 'x'.repeat(30));
    w.fetch = async () => new Response(JSON.stringify({
        candidates: [{ content: { parts: [{ text: '<img src=x onerror=window.__xss=1>\nCusto' }] } }],

test('Núcleo: limites de sensibilidade conferem com busca exaustiva', async () => {
    const w = await load();
    // Gerador determinístico, para uma falha ser reproduzível
    let seed = 12345;
    const random = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
    const EPSILON = 1e-6;
    let limitsChecked = 0, stableChecked = 0;

    for (let round = 0; round < 300; round++) {
        const criterionCount = 2 + Math.floor(random() * 4);
        const alternativeCount = 2 + Math.floor(random() * 5);
        const cIds = Array.from({ length: criterionCount }, (_, i) => `c${i}`);
        const aIds = Array.from({ length: alternativeCount }, (_, i) => `a${i}`);

        const table = {};
        cIds.forEach(c => {
            table[c] = {};
            aIds.forEach(a => { table[c][a] = Math.round(random() * 100) / 10; });
        });
        const data = scoresTable(table);

        // Parte das rodadas tem pesos zerados, inclusive um critério com 100%
        const raw = {};
        cIds.forEach(c => { raw[c] = random() < 0.2 ? 0 : random(); });
        if (round % 10 === 0) { cIds.forEach(c => { raw[c] = 0; }); raw.c0 = 1; }
        const weights = w.normalizeWeights(raw);

        const analysis = w.analyzeSensitivity(cIds, aIds, data, weights);
        if (analysis.status !== 'ok') continue;

        const finalsAt = (criterion, weight) => w.computeFinalScores(cIds, aIds, data, w.redistributeWeights(weights, criterion, weight));
        const context = `rodada ${round}`;

        analysis.criteria.forEach(({ id, weight, low, high }) => {
            [[low, -1], [high, 1]].forEach(([limit, direction]) => {
                if (limit) {
                    const inside = finalsAt(id, limit.weight - direction * EPSILON);
                    const outside = finalsAt(id, limit.weight + direction * EPSILON);
                    if (aIds.some(a => inside[a] > inside[analysis.winner] + 1e-9)) {
                        throw new Error(`${context}: vencedora superada antes do limite de ${id}`);
                    }
                    if (!(outside[limit.challenger] > outside[analysis.winner])) {
                        throw new Error(`${context}: rival não supera depois do limite de ${id}`);
                    }
                    limitsChecked++;
                } else {
                    // Sem limite neste sentido: a vencedora resiste até o extremo
                    const end = direction < 0 ? 0 : 1;
                    for (let step = 0; step <= 200; step++) {
                        const t = weight + (end - weight) * step / 200;
                        const finals = finalsAt(id, t);
                        if (aIds.some(a => finals[a] > finals[analysis.winner] + 1e-9)) {
                            throw new Error(`${context}: ${id} a ${t} troca a vencedora, sem limite informado`);
                        }
                        stableChecked++;
                    }
                }
            });
        });
    }
    if (limitsChecked < 100 || stableChecked < 100) throw new Error(`amostra pequena: ${limitsChecked}/${stableChecked}`);
});

function assertFits(w, label) {
    const page = w.document.documentElement;
    if (page.scrollWidth > page.clientWidth) {
        const wide = [...w.document.querySelectorAll('body *')]
            .filter(e => e.getBoundingClientRect().right > page.clientWidth + 1 && !e.closest('.table-scroll, .step-progress, [style*="overflow-x"]'))

        throw new Error(`${label}: rolagem horizontal (${page.scrollWidth} > ${page.clientWidth}): ${wide}`);
    }
}

function fakeStorage(items) {
    const data = { ...items };
    return { getItem: k => data[k] ?? null, setItem: (k, v) => { data[k] = v; }, data };
}

function redirectFrom(w, hostname, storage) {
    let target = null;
    w.redirectToCanonicalSite({ hostname, replace: url => { target = url; } }, storage);
    return target;
}

});

// ---- Execução ----
// Os testes apagam o localStorage do domínio: fora da máquina local, destruiriam as
// análises e a chave de API de quem abrisse esta página no site publicado
const isLocalPage = ['localhost', '127.0.0.1'].includes(location.hostname);

(async () => {
    if (!isLocalPage) {
        document.getElementById('summary').textContent =
            'Estes testes só rodam localmente, porque apagam os dados salvos no navegador. Veja o README.';
        return;
    }

    const list = document.getElementById('list');
    for (const { name, fn } of tests) {
        let error = null;
        try { await fn(); } catch (e) { error = String(e.message || e); }
        results.push({ name, error });
        const item = document.createElement('li');
        item.className = error ? 'fail' : 'pass';
        item.textContent = error ? `${name} — ${error}` : name;
        list.appendChild(item);
    }
    if (frame) frame.remove();
    const failed = results.filter(r => r.error).length;
    document.getElementById('summary').textContent =
        `${results.length - failed} de ${results.length} testes passaram`;
    // Consumido por tests/run.py; ignorado ao abrir a página manualmente
    fetch('/__results', { method: 'POST', body: JSON.stringify(results) }).catch(() => {});
})();
</script>
</body>
</html>
